<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#0e1217" />
      <stop offset="100%" stop-color="#07090c" />
    </linearGradient>
    <linearGradient id="jet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="920" height="280" rx="14" fill="url(#bg)" />
  <rect width="920" height="280" rx="14" fill="url(#grid)" />
  <rect width="918" height="278" x="1" y="1" rx="13" fill="none" stroke="#30363d" stroke-width="1" stroke-opacity="0.7" />

  <!-- Terminal Header Bar -->
  <path d="M 1 14 A 13 13 0 0 1 14 1 L 906 1 A 13 13 0 0 1 919 14 L 919 36 L 1 36 Z" fill="#13171f" />
  <line x1="1" y1="36" x2="919" y2="36" stroke="#21262d" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="18" r="5" fill="#f43f5e" />
  <circle cx="42" cy="18" r="5" fill="#fbbf24" />
  <circle cx="60" cy="18" r="5" fill="#10b981" />

  <!-- Header Title -->
  <text x="82" y="22" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="1">
    t58574@workstation: ~/dev/runtime -- [mode: zero-bloat]
  </text>
  <text x="880" y="22" fill="#52525b" font-family="ui-monospace, monospace" font-size="11" text-anchor="end">
    release // 2026.10
  </text>

  <!-- Left Content Column -->
  <!-- Callout Tag -->
  <rect x="36" y="58" width="134" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="48" cy="69" r="3" fill="#38bdf8" />
  <text x="58" y="73" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="0.5">
    SYSTEMS &amp; CORE
  </text>

  <!-- Nickname -->
  <text x="36" y="126" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="34" font-weight="800" letter-spacing="2">
    T58574
  </text>

  <!-- Punchline -->
  <text x="36" y="160" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="13" font-weight="500">
    <tspan fill="#38bdf8">&gt;</tspan> Building software that doesn't waste RAM or leak into the cloud.
  </text>
  <text x="36" y="182" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">
    Rust / Go / TypeScript / Local AI / ConPTY / High-TPS WebSockets
  </text>

  <!-- Rofl / Status Lines -->
  <g transform="translate(36, 212)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="16" fill="#10b981" font-family="ui-monospace, monospace" font-size="10.5">
      ✓ 100% runs on my machine
    </text>

    <!-- Pill 2 -->
    <rect x="190" y="0" width="220" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="202" y="16" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="10.5">
      ⚠ zero enterprise agile slop
    </text>

    <!-- Pill 3 -->
    <rect x="420" y="0" width="130" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="432" y="16" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10.5">
      ⚡ local-first AI
    </text>
  </g>

  <!-- Footer status -->
  <text x="36" y="262" fill="#64748b" font-family="ui-monospace, monospace" font-size="10.5">
    contact: <tspan fill="#38bdf8">@t58574_bot</tspan> on Telegram // direct terminal pipeline
  </text>

  <!-- Right Graphic: Stylized Minimalist F/A-18 Vector Wireframe -->
  <g transform="translate(740, 160) rotate(-28) scale(0.95)">
    <!-- Ambient Jet Glow -->
    <ellipse cx="0" cy="0" rx="90" ry="120" fill="url(#jet-glow)" filter="blur(24px)" opacity="0.35" />

    <!-- Fuselage Centerline & Nosecone -->
    <path d="M 0 -95 L 8 -50 L 12 10 L 16 70 L 8 85 L -8 85 L -16 70 L -12 10 L -8 -50 Z" 
          fill="#0c1322" stroke="#38bdf8" stroke-width="1.8" />
    
    <!-- Cockpit Canopy -->
    <path d="M -4 -42 Q 0 -58 4 -42 L 5 -12 Q 0 -6 -5 -12 Z" 
          fill="#38bdf8" fill-opacity="0.35" stroke="#7dd3fc" stroke-width="1.2" />

    <!-- Leading Edge Extensions (LEX) -->
    <path d="M -8 -45 L -26 -5 L -26 30 L -12 30" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="2 2" />
    <path d="M 8 -45 L 26 -5 L 26 30 L 12 30" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="2 2" />

    <!-- Main Wings -->
    <path d="M -26 15 L -92 48 L -94 62 L -20 54" 
          fill="#0f172a" stroke="#38bdf8" stroke-width="1.6" />
    <path d="M 26 15 L 92 48 L 94 62 L 20 54" 
          fill="#0f172a" stroke="#38bdf8" stroke-width="1.6" />

    <!-- Wingtip Rails (Missile mounts) -->
    <line x1="-92" y1="44" x2="-92" y2="66" stroke="#7dd3fc" stroke-width="2" />
    <line x1="92" y1="44" x2="92" y2="66" stroke="#7dd3fc" stroke-width="2" />

    <!-- Twin Vertical Stabilizers (Canted Outward) -->
    <path d="M -16 45 L -36 82 L -24 88 L -10 68" 
          fill="#1e293b" stroke="#38bdf8" stroke-width="1.4" />
    <path d="M 16 45 L 36 82 L 24 88 L 10 68" 
          fill="#1e293b" stroke="#38bdf8" stroke-width="1.4" />

    <!-- Horizontal Stabilators -->
    <path d="M -14 74 L -52 100 L -48 108 L -8 92" 
          fill="#0c1322" stroke="#0284c7" stroke-width="1.2" />
    <path d="M 14 74 L 52 100 L 48 108 L 8 92" 
          fill="#0c1322" stroke="#0284c7" stroke-width="1.2" />

    <!-- Twin Engine Exhausts -->
    <ellipse cx="-7" cy="85" rx="5" ry="3" fill="#38bdf8" fill-opacity="0.8" stroke="#7dd3fc" stroke-width="1" />
    <ellipse cx="7" cy="85" rx="5" ry="3" fill="#38bdf8" fill-opacity="0.8" stroke="#7dd3fc" stroke-width="1" />

    <!-- Afterburner Shock Diamonds -->
    <polygon points="-7,90 -5,98 -7,106 -9,98" fill="#38bdf8" opacity="0.8" />
    <polygon points="7,90 9,98 7,106 5,98" fill="#38bdf8" opacity="0.8" />
  </g>
</svg>
